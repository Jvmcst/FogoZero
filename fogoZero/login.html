<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogo Zero - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsividades.css">
</head>

<body>
<main class="container">
    <section class="card login-card">
        <button type="button" id="btn-tema" aria-label="Alternar tema">☾ Escuro</button>
        <div class="logo">
            <img src="img/logo.png" alt="Logo Fogo Zero">
        </div>
        <h1>Fogo Zero</h1>
        <p class="subtitulo">
            Bem-vindo de volta. Autentique-se para<br>continuar.
        </p>

        <form id="form-login" action="mapa.html" autocomplete="off">
            <div class="campo">
                <label for="email">E-mail</label>
                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder="davi@email.com" autocomplete="off" required>
                </div>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <div class="input-container">
                    <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>
            <div class="opcoes">
                <label class="lembrar">
                    <input type="checkbox" name="lembrar">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" class="esqueci">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="botao">Entrar</button>
        </form>
        <div class="divisor"></div>
        <p class="cadastro-link">
            Ainda não tem uma conta? <a href="cadastro.html">Registre-se aqui.</a>
        </p>
    </section>
</main>
<script src="js/temaEscuro.js"></script>
<script>
    const formLogin = document.getElementById('form-login');
    const inputEmail = document.getElementById('email');
    const inputSenha = document.getElementById('senha');

    function limparCamposLogin() {
        if (formLogin) formLogin.reset();
        if (inputEmail) inputEmail.value = '';
        if (inputSenha) inputSenha.value = '';
    }

    // Garante que os campos fiquem vazios ao sair da conta (inclusive contra autofill do navegador)
    window.addEventListener('pageshow', () => {
        limparCamposLogin();
        setTimeout(limparCamposLogin, 50);
    });

    if (formLogin) {
        formLogin.addEventListener('submit', (evento) => {
            evento.preventDefault();

            const emailDigitado = inputEmail ? inputEmail.value.trim() : '';
            const senhaDigitada = inputSenha ? inputSenha.value.trim() : '';

            if (!emailDigitado || !senhaDigitada) {
                alert('Preencha o e-mail e a senha para entrar.');
                return;
            }

            const cadastrado = JSON.parse(localStorage.getItem('usuarioCadastrado'));

            if (cadastrado && cadastrado.email === emailDigitado) {
                localStorage.setItem('usuarioLogado', JSON.stringify(cadastrado));
            } else {
                localStorage.setItem('usuarioLogado', JSON.stringify({
                    nome: emailDigitado.split('@')[0],
                    email: emailDigitado,
                    telefone: '',
                    cidade: ''
                }));
            }

            window.location.href = 'mapa.html';
        });
    }
</script>
</body>

</html>

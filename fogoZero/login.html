<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogo Zero - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsividades.css">
</head>
<body>
    <main class="container">
        <section class="card login-card">
            <div class="logo">
                <img src="img/logo.png" alt="Logo Fogo Zero">
            </div>
            <h1>Fogo Zero</h1>
            <p class="subtitulo">
                Bem-vindo de volta. Autentique-se para<br>continuar.
            </p>
            
            <!-- action aponta para a tela do app -->
            <form action="telaPrincipal.html">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <input type="email" id="email" name="email" placeholder="davi@email.com">
                    </div>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="input-container">
                        <input type="password" id="senha" name="senha" placeholder="••••••••">
                    </div>
                </div>
                <div class="opcoes">
                    <label class="lembrar">
                        <input type="checkbox" name="lembrar">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="esqueci">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="botao">Entrar</button>
            </form>
            <div class="divisor"></div>
            <p class="cadastro-link">
                Ainda não tem uma conta? <a href="cadastro.html">Registre-se aqui.</a>
            </p>
        </section>
    </main>
</body>
</html>

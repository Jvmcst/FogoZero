<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogo Zero - Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/responsividades.css">
</head>
<body>
    <main class="container">
        <section class="card cadastro-card">
            <div class="logo">
                <img src="img/logo.png" alt="Logo Fogo Zero">
            </div>
            <h1>Fogo Zero</h1>
            <p class="subtitulo">Crie sua conta</p>
            
            <!-- action aponta para a tela do app -->
            <form action="telaPrincipal.html">
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <div class="input-container">
                        <input type="text" id="nome" name="nome" placeholder="Ex: Davi">
                    </div>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <input type="email" id="email" name="email" placeholder="davi@email.com">
                    </div>
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <div class="input-container">
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
                    </div>
                </div>
                <div class="campo">
                    <label for="cep">CEP</label>
                    <div class="input-container">
                        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric">
                    </div>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="input-container">
                        <input type="password" id="senha" name="senha" placeholder="••••••••">
                    </div>
                </div>
                <div class="campo">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <div class="input-container">
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="botao">Criar Conta</button>
            </form>
            <div class="divisor"></div>
            <p class="cadastro-link">
                Já possui uma conta? <a href="login.html">Faça login.</a>
            </p>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fogo Zero - Mapa de focos</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/reportar.css">
    <link rel="stylesheet" href="css/responsividades.css">
    <link rel="stylesheet" href="css/mapa.css">
</head>

<body class="pagina-mapa">
<header class="cabecalho">
    <div class="cabecalho-conteudo">
        <div class="marca">
            <img src="img/logo.png" alt="Fogo Zero" class="marca-logo" width="50" height="50" />
            <span class="marca-nome">Fogo Zero</span>
        </div>
        <nav class="nav-desktop">
            <a href="#" class="nav-link nav-alertas">Alertas</a>
            <label for="toggle-conta" class="nav-link" style="cursor: pointer;">Conta</label>
            <button type="button" id="btn-tema" aria-label="Alternar tema">☾ Escuro</button>
            <a href="reportar.html" class="btn-reportar">Reportar incêndio</a>
        </nav>
    </div>
</header>

<main>
    <div id="mapa"></div>
</main>

<!-- menu da conta dentro do body -->
<input type="checkbox" id="toggle-conta" hidden>

<label for="toggle-conta" class="painel-fundo"></label>

<aside class="painel-conta">
    <div class="painel-cabecalho">
        <h2>Minha conta</h2>
        <label for="toggle-conta" class="painel-fechar" title="Fechar">&times;</label>
    </div>

    <div class="painel-corpo">
        <div class="avatar-conta">&#9786;</div>

        <form action="mapa.html">
            <div class="campo-conta">
                <label for="conta-nome">Nome completo</label>
                <input type="text" id="conta-nome" placeholder="Ex: Davi" />
            </div>
            <div class="campo-conta">
                <label for="conta-email">E-mail</label>
                <input type="email" id="conta-email" placeholder="davi@email.com" />
            </div>
            <div class="campo-conta">
                <label for="conta-telefone">Telefone</label>
                <input type="tel" id="conta-telefone" placeholder="(00) 00000-0000" maxlength="15" />
            </div>
            <div class="campo-conta">
                <label for="conta-cidade">Cidade / UF</label>
                <input type="text" id="conta-cidade" placeholder="Cidade - UF" />
            </div>

            <div class="painel-rodape">
                <button type="submit" class="btn-painel btn-painel-principal">Salvar Dados</button>
                <a href="login.html" class="btn-painel btn-painel-secundario" style="text-decoration: none;">Sair da Conta</a>
            </div>
        </form>
    </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/mapa.js"></script>
<script src="js/temaEscuro.js"></script>
</body>

</html>
